name: Build QuartusII Container Image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quartus_container.yaml'
      - 'Containers/QuartusII_x64/**'
  pull_request:
    paths:
      - '.github/workflows/quartus_container.yaml'
      - 'Containers/QuartusII_x64/**'
  workflow_dispatch:

jobs:
  build-quartus-container:
    name: Build Quartus II 13.0 SP1 Container
    runs-on: ubuntu-latest
    # Downloading 4.5 GB from Altera and running their unattended installer is
    # slow, and the installer gets no faster for being watched.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      # A standard GitHub-hosted runner ships with ~25 GB free, and this build
      # wants more than that: the 4.5 GB tarball, its ~4.5 GB extraction, the
      # install tree, and then the image layers on top. Everything removed here
      # is preinstalled tooling this build has no use for.
      - name: Reclaim Runner Disk Space
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests from forks get a read-only token, and there is nowhere
      # for them to push anyway, so they build and stop.
      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/quartus2
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{branch}}-latest
            type=sha,prefix={{branch}}-
            type=ref,event=tag
            type=ref,event=pr

      # The installer tarball is gitignored, so it is never in the checkout and
      # the Containerfile's download branch is the one CI always takes. That is
      # affordable because the triggers above only fire when the Containerfile
      # itself changes, which is close to never.
      #
      # Altera's CDN 403s anything that does not look like a browser; the
      # Containerfile's wget carries the header block that gets through. A 403
      # here means that block has gone stale, not that the URL died.
      #
      # `file:` is not optional. Podman picks up a Containerfile by name, but
      # this action runs buildx, which only ever auto-detects `Dockerfile` --
      # without this it fails the build claiming the context has no Dockerfile.
      #
      # No GitHub Actions layer cache: the cache is capped at 10 GB per repo
      # and the install layer alone is larger than that, so caching would
      # evict itself on every run while adding an upload of the same size.
      - name: Build Quartus II 13.0 SP1 Container
        uses: docker/build-push-action@v6
        with:
          context: ./Containers/QuartusII_x64
          file: ./Containers/QuartusII_x64/Containerfile
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' }}

      - name: Report Remaining Disk Space
        if: always()
        run: df -h /
