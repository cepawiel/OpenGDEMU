[package]
name = "fwupdater"
description = "Standalone RAM-resident flash writer, embedded into the firmware as a raw blob"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fwupdater"
path = "src/main.rs"
test = false
bench = false

[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# No unwinder, and no landing pads to pull one in.
panic = "abort"
